  "prompt": "当前工作目录是 torch-scatter 的源码（上游 https://github.com/rusty1s/pytorch_scatter，commit f514c10f920b5aeed2eb162092f0ad20d3edee52 的 tarball 解压，不含 .git）。请把它移植到本机的 MetaX C500 GPU 上构建并运行。\n\n已知环境事实：本机有 1 块 MetaX C500（64GiB 显存）；MACA toolkit 3.7.1.5 安装在 /opt/maca；已安装 torch 2.8.0+metax3.7.1.3（MetaX 版 PyTorch，CUDA API 已映射到 MACA）；系统没有 nvcc，也没有 NVIDIA GPU；cmake 3.28.3、gcc 13.3.0 可用。\n\n交付物（全部必须完成）：\n1. CUDA 扩展在本机成功构建，且 python3 -c \"import torch_scatter\" 成功；\n2. 上游 pytest 测试套件（test/ 目录）在 GPU 上通过（单卡不适用的用例允许按上游逻辑 skip，不允许修改测试断言让其通过）；\n3. 运行上游 benchmark/ 目录中的脚本产出计时结果，计时必须包含 warmup 与设备同步、保留全部样本；\n4. 在源码根目录写 PORTING_NOTES.md，列出每一处修改及原因。\n\n约束：不要改动或重装已安装的 torch；可以用 pip 安装其他构建与测试依赖（如 pytest）；除安装依赖外，所有文件修改限制在当前工作目录内。"
