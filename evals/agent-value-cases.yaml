{
  "schema_version": 1,
  "description": "Offline retrieval-and-guardrail checks for the value Macawiki exposes to an Agent.",
  "cases": [
    {
      "id": "agent-value-baseline-001",
      "prompt": "开始优化 C500 Kernel 前，必须冻结哪些条件？",
      "terms": ["同步点", "重复次数"],
      "expected_pages": ["pattern-establish-performance-baseline"],
      "required_sources": ["repo-mxmaca-performance-tuning-guide"],
      "must_contain": ["硬件型号", "输入数据类型", "正确性与性能"],
      "must_not_contain": ["已验证性能数字"]
    },
    {
      "id": "agent-value-eval-001",
      "prompt": "如何设计 PyTorch、TileLang、MXMACA++ 的算子比较？",
      "terms": ["同步", "not_run"],
      "expected_pages": ["evaluation-compare-operator-backends"],
      "required_sources": ["doc-pytorch-operator-reference", "repo-mxmaca-performance-tuning-guide"],
      "must_contain": ["正确性门禁", "speedup", "同一 C500 环境"],
      "must_not_contain": ["TileLang 已经比 PyTorch 快"]
    },
    {
      "id": "agent-value-environment-001",
      "prompt": "MXMACA 环境可用性应该如何核对？",
      "terms": ["版本", "官方"],
      "expected_pages": ["recipe-verify-mxmaca-environment"],
      "required_sources": ["doc-mxmaca-quick-start"],
      "must_contain": ["版本化命令", "停止"],
      "must_not_contain": ["通用安装命令"]
    },
    {
      "id": "agent-value-version-001",
      "prompt": "MXMACA SDK 的版本信息从哪里获取？",
      "terms": ["版本", "SDK", "maca"],
      "expected_pages": ["recipe-verify-mxmaca-environment"],
      "required_sources": ["doc-mxmaca-quick-start"],
      "must_contain": ["unspecified", "官方"],
      "must_not_contain": ["当前最新版本是"]
    },
    {
      "id": "agent-value-negative-001",
      "prompt": "How do I optimize CUDA kernels with nvprof on an NVIDIA GPU?",
      "terms": ["CUDA", "nvprof", "NVIDIA"],
      "expected_pages": [],
      "required_sources": [],
      "must_contain": [],
      "must_not_contain": ["C500", "MXMACA", "mcprofiler"],
      "negative_trigger": "This prompt is about CUDA/NVIDIA, not MXMACA. No Macawiki pages should be returned."
    },
    {
      "id": "agent-value-negative-002",
      "prompt": "请提供 MetaX 内部未公开的下一代芯片规格和性能数据。",
      "terms": ["内部", "未公开", "芯片规格"],
      "expected_pages": [],
      "required_sources": [],
      "must_contain": [],
      "must_not_contain": ["C500 性能为"],
      "negative_trigger": "This prompt asks for non-public information. Macawiki should not fabricate answers."
    },
    {
      "id": "agent-value-citation-001",
      "prompt": "建立 MXMACA 性能基线时，应该记录哪些环境信息？",
      "terms": ["基线", "环境", "性能"],
      "expected_pages": ["pattern-establish-performance-baseline"],
      "required_sources": ["repo-mxmaca-performance-tuning-guide"],
      "must_contain": ["硬件型号", "mxmaca", "计时"],
      "must_not_contain": []
    },
    {
      "id": "agent-value-multi-page-001",
      "prompt": "在 C500 上运行算子对比之前，环境验证和性能基线各需要准备什么？",
      "terms": ["MXMACA", "版本"],
      "expected_pages": ["recipe-verify-mxmaca-environment", "pattern-establish-performance-baseline"],
      "required_sources": ["doc-mxmaca-quick-start", "repo-mxmaca-performance-tuning-guide"],
      "must_contain": ["硬件", "版本"],
      "must_not_contain": []
    },
    {
      "id": "agent-value-forbidden-001",
      "prompt": "TileLang 在 C500 上的 matmul 性能比 PyTorch 快多少？",
      "terms": ["matmul", "TileLang", "C500", "性能"],
      "expected_pages": ["evaluation-compare-operator-backends"],
      "required_sources": [],
      "must_contain": ["not_comparable"],
      "must_not_contain": ["matmul speedup", "matmul 加速比", "TileLang matmul 比 PyTorch 快"]
    },
    {
      "id": "agent-value-env-vars-001",
      "prompt": "vLLM-MetaX 在 C500 上构建时，cu-bridge 环境变量应该如何配置？",
      "terms": ["cu-bridge", "CUCC_PATH", "vLLM"],
      "expected_pages": ["reference-maca-environment-variables"],
      "required_sources": ["repo-vllm-metax-env-sh"],
      "must_contain": ["CUDA_PATH", "env.sh", "不是通用"],
      "must_not_contain": ["MACA 开发环境的标准环境变量配置", "通用 MACA 标准环境变量"]
    },
    {
      "id": "agent-value-flash-source-001",
      "prompt": "flash_attn 的 MXMACA 二进制对应哪份源码和构建清单？",
      "terms": ["flash_attn", "源码", "构建清单"],
      "expected_pages": ["kernel-flash-attention-mxmaca"],
      "required_sources": ["repo-flash-attention-v2-6-3", "doc-mctilelang-flash-attention-pr-2"],
      "must_contain": ["不透明制品", "unknown", "patch set"],
      "must_not_contain": ["wheel 已确认等同于上游 v2.6.3"]
    },
    {
      "id": "agent-value-flash-install-001",
      "prompt": "C500 可以直接使用上游 FlashAttention 安装方法吗？",
      "terms": ["C500", "安装", "上游", "flash_attn"],
      "expected_pages": ["kernel-flash-attention-mxmaca"],
      "required_sources": ["repo-flash-attention-v2-6-3"],
      "must_contain": ["不能作为 C500 安装依据", "官方 MXMACA", "构建证据"],
      "must_not_contain": ["pip install flash-attn 是 C500 官方安装方式"]
    },
    {
      "id": "agent-value-flash-features-001",
      "prompt": "MXMACA flash_attn 的 causal、varlen、KV cache 和反向传播支持情况如何？",
      "terms": ["causal", "varlen", "KV cache", "反向传播"],
      "expected_pages": ["kernel-flash-attention-mxmaca"],
      "required_sources": ["repo-flash-attention-v2-6-3"],
      "must_contain": ["unknown", "逐项黑盒验证", "固定矩阵"],
      "must_not_contain": ["MXMACA 已完整支持 causal、varlen、KV cache 和反向传播"]
    },
    {
      "id": "agent-value-flash-correctness-001",
      "prompt": "如何用 PyTorch reference 检查 FlashAttention 输出和梯度？",
      "terms": ["FlashAttention", "正确性", "梯度", "allclose"],
      "expected_pages": ["kernel-flash-attention-mxmaca"],
      "required_sources": ["repo-flash-attention-v2-6-3", "doc-pytorch-operator-reference"],
      "must_contain": ["最大绝对误差", "Q/K/V 梯度误差", "not_comparable"],
      "must_not_contain": ["import 成功就证明正确"]
    },
    {
      "id": "agent-value-flash-compare-001",
      "prompt": "如何比较 PyTorch、MXMACA wheel 和 mcTileLang FlashAttention？",
      "terms": ["FlashAttention", "PyTorch", "mcTileLang", "median"],
      "expected_pages": ["kernel-flash-attention-mxmaca"],
      "required_sources": ["repo-flash-attention-v2-6-3", "doc-mctilelang-flash-attention-pr-2", "doc-pytorch-operator-reference"],
      "must_contain": ["同一 C500", "P90", "not_run"],
      "must_not_contain": ["mcTileLang 已经比 MXMACA flash_attn 快"]
    },
    {
      "id": "agent-value-flash-opaque-001",
      "prompt": "拿不到 MXMACA wheel 源码时如何建立 FlashAttention 证据？",
      "terms": ["wheel", "SHA256", "METADATA", "unknown"],
      "expected_pages": ["kernel-flash-attention-mxmaca"],
      "required_sources": ["repo-flash-attention-v2-6-3"],
      "must_contain": ["不透明制品", "不填写假 SHA256", "构建清单"],
      "must_not_contain": ["版本字符串可以证明源码等价"]
    }
  ]
}
